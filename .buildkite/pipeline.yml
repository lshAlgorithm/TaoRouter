# vLLM Router test pipeline bootstrap.
# Builds the release binary and wheel, then uploads L1–L3 (issue #273).
# Image publish stays in release-pipeline.yml.
# NIGHTLY=1 on this pipeline selects tests. NIGHTLY=1 on router-release
# publishes images. Those are different pipelines.

env:
  RUST_IMAGE: "rust:1.95.0-bookworm"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  # Disable incremental compilation for consistent CI builds
  CARGO_INCREMENTAL: "0"
  # Enable full Rust backtraces for debugging
  RUST_BACKTRACE: "1"


steps:

  # ============================================================================
  # Build - Create release artifacts
  # ============================================================================
  - group: ":hammer: Build"
    key: "build"
    steps:
      - label: ":rust: Build Rust (Release)"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  cargo build --release
        artifact_paths:
          - "target/release/vllm-router"
        agents:
          queue: "cpu_queue_premerge"

      - label: ":python: Build Python Wheel"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler python3 python3-pip python3-dev python3-venv
                  python3 -m venv /tmp/venv
                  source /tmp/venv/bin/activate
                  pip install -U pip setuptools wheel setuptools-rust build
                  python -m build
        artifact_paths:
          - "dist/*.whl"
          - "dist/*.tar.gz"
        agents:
          queue: "cpu_queue_premerge"

  # Uploads wait for the build group, the same way Omni uploads wait for image-build.
  # They do not wait on each other. L2/L3 jobs still depend_on "build" for the artifact.
  - label: ":pipeline: Upload L1 ready"
    key: "upload-ready-pipeline"
    depends_on: "build"
    command: |
      python3 -c "import yaml" 2>/dev/null || python3 -m pip install --disable-pip-version-check --quiet pyyaml
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-ready.yml
    agents:
      queue: "cpu_queue_premerge"

  # L2: default-branch push, or any other branch labeled merge-test.
  # Scheduled main + NIGHTLY=1 stays on L3 (same split as Omni MERGE_MAIN_IF).
  - label: ":pipeline: Upload L2 merge"
    key: "upload-merge-pipeline"
    depends_on: "build"
    if: |
      (
        build.branch == pipeline.default_branch &&
        build.env("NIGHTLY") != "1"
      ) ||
      (
        build.branch != pipeline.default_branch &&
        build.pull_request.labels includes "merge-test"
      )
    command: |
      python3 -c "import yaml" 2>/dev/null || python3 -m pip install --disable-pip-version-check --quiet pyyaml
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-merge.yml
    agents:
      queue: "cpu_queue_premerge"

  # L3: default-branch NIGHTLY=1, or any other branch labeled nightly-test.
  # RUN_ROCM_* is a UI/API env, not a GitHub label, so it stays a third clause.
  # Each ROCm job still has its own if.
  - label: ":pipeline: Upload L3 nightly"
    key: "upload-nightly-pipeline"
    depends_on: "build"
    if: |
      (
        build.branch == pipeline.default_branch &&
        build.env("NIGHTLY") == "1"
      ) ||
      (
        build.branch != pipeline.default_branch &&
        build.pull_request.labels includes "nightly-test"
      ) ||
      build.env("RUN_ROCM_RDMA") == "1" ||
      build.env("RUN_ROCM_XGMI") == "1"
    command: |
      python3 -c "import yaml" 2>/dev/null || python3 -m pip install --disable-pip-version-check --quiet pyyaml
      python3 .buildkite/scripts/upload_pipeline.py --upload .buildkite/test-nightly.yml
    agents:
      queue: "cpu_queue_premerge"
