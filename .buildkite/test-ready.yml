# L1 ready (https://github.com/vllm-project/router/issues/273).
# Uploaded on every build by pipeline.yml, after the build group there.
# CPU unit and integration tests, a non-publishing image build, and one
# NVIDIA P/D completion on trusted builds. Full GSM8K is test-nightly.yml.
# py_test/e2e stays ignored here; regular-router, embeddings, and
# test_pd_router.py are not wired to a GPU lane in this split.

env:
  RUST_IMAGE: "rust:1.95.0-bookworm"
  # Pin the ROCm nightly used by the MoRI lane so dependency changes are explicit.
  ROCM_VLLM_IMAGE: "vllm/vllm-openai-rocm:nightly@sha256:d22922d540810d90c5a3eafe91d3b4a62c2b881f3e990d0b7180b2875a5d176d"
  # Disable incremental compilation for consistent CI builds
  CARGO_INCREMENTAL: "0"
  # Enable full Rust backtraces for debugging
  RUST_BACKTRACE: "1"


steps:
  # ============================================================================
  # Tests - Run comprehensive test suite
  # ============================================================================
  - group: ":test_tube: Tests"
    key: "tests"
    steps:
      - label: ":rust: Rust Unit Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  # wasm_middleware unit tests load the example component artifact
                  bash examples/wasm_middleware/build.sh
                  cargo test --lib --bins
        agents:
          queue: "cpu_queue_premerge"

      - label: ":rust: Rust Integration Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler
                  cargo test --test '*'
        agents:
          queue: "cpu_queue_premerge"

      - label: ":python: Python Tests"
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              workdir: /workdir
              volumes:
                - ".:/workdir"
              environment:
                - "CARGO_INCREMENTAL=0"
                - "RUST_BACKTRACE=1"
              command:
                - bash
                - -c
                - |
                  apt-get update && apt-get install -y pkg-config libssl-dev protobuf-compiler python3 python3-pip python3-dev python3-venv
                  # WASM middleware pytest needs the example component + router binary
                  bash examples/wasm_middleware/build.sh
                  cargo build --release --bin vllm-router
                  python3 -m venv /tmp/venv
                  source /tmp/venv/bin/activate
                  pip install -U pip setuptools wheel setuptools-rust
                  pip install -e .[dev]
                  pip install pytest pytest-cov pytest-asyncio
                  pytest py_test/ -v --ignore=py_test/e2e --cov=vllm_router --cov-report=xml --cov-report=term
        artifact_paths:
          - "coverage.xml"
        agents:
          queue: "cpu_queue_premerge"

  # ============================================================================
  # L1 P/D smoke — one /v1/completions on EKS l4-k8s (4x L4).
  # /health and /v1/models run inside test_pd_accuracy.py.
  # Full GSM8K is test-nightly.yml. Forks skip this job.
  # ============================================================================
  - label: ":satellite: P/D Disaggregation Smoke (4 GPUs)"
    key: "pd-disagg-smoke"
    # ROCm-only scheduled builds use the dedicated MI300X queue and should not
    # wait for an unrelated NVIDIA worker before the build can finish.
    # Trusted builds only. Forks have no GPU secrets. Nightly runs full GSM8K
    # from test-nightly.yml instead of this smoke.
    if: |
      build.env("ROCM_ONLY") != "1" &&
      build.env("NIGHTLY") != "1" &&
      (build.pull_request.id == null || build.pull_request.repository.fork == false) &&
      (build.pull_request.id == null || !(build.pull_request.labels includes "nightly-test"))
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
      manual:
        allowed: true
        reason: "GPU tests can be flaky - retry if needed"
    mirror_hardwares: l4_4
    # agent-stack-k8s invokes the step with /bin/sh. Dash rejects
    # `set -o pipefail` and `source`, so run the job body under bash.
    command: |
      bash <<'BASH'
      set -euo pipefail

      # Verify HF_TOKEN is set (required for gated models like Llama)
      if [ -z "$${HF_TOKEN:-}" ]; then
        echo "ERROR: HF_TOKEN is not set. This is required for gated models."
        echo "Please configure the hf-token-secret Kubernetes secret."
        exit 1
      fi
      echo "HF_TOKEN is configured."

      # Install system dependencies
      apt-get update && apt-get install -y \
        curl \
        ffmpeg \
        python3 \
        python3-pip \
        pkg-config \
        libssl-dev \
        protobuf-compiler \
        git

      # Install uv for fast Python package management
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source /root/.local/bin/env

      # Create Python virtual environment (as recommended by vLLM)
      uv venv --python 3.12 --seed
      source .venv/bin/activate

      # Install vLLM with CUDA 13 support
      uv pip install vllm --torch-backend=cu130

      # Install NIXL library for P/D disaggregation
      uv pip install nixl-cu13
      uv pip install nixl --no-deps

      # Fail fast if CUDA-specific wheels do not match the CI image.
      python - <<'PY'
      import nixl
      import nixl_ep
      import torch
      import vllm

      assert torch.version.cuda and torch.version.cuda.startswith("13."), torch.version.cuda
      assert nixl._api.__name__.startswith("nixl_cu13."), nixl._api.__name__
      print(f"vLLM {vllm.__version__}, torch CUDA {torch.version.cuda}, {nixl._api.__name__}, {nixl_ep.__name__}")
      PY

      # Install test dependencies
      uv pip install requests pytest openai

      # Model download uses hf_transfer. Full GSM8K / LM-Eval is test-nightly.yml.
      uv pip install hf_transfer

      # Install Rust for building the router
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      source /root/.cargo/env

      # Build the router
      cargo build --release
      export PATH="$$PWD/target/release:$$PATH"

      # L1 smoke: /health, /v1/models, and one completion. Not full GSM8K.
      cd py_test/e2e/pd_disagg_vllm
      export SKIP_LM_EVAL=true
      export NUM_SANITY_REQUESTS=1
      bash ./run_accuracy_test.sh
      BASH
    depends_on: "build"
    artifact_paths:
      - "/tmp/router.log"

  # ============================================================================
  # Docker Build - Parallel with tests
  # ============================================================================
  - label: ":docker: Build Docker Image"
    command: |
      docker build -f Dockerfile.router -t vllm-router:${BUILDKITE_COMMIT} .
      docker tag vllm-router:${BUILDKITE_COMMIT} vllm-router:latest
    agents:
      queue: "cpu_queue_premerge"
    depends_on: "build"
